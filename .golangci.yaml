# yaml-language-server: $schema=https://raw.githubusercontent.com/golangci/golangci-lint/refs/tags/v2.10.1/jsonschema/golangci.jsonschema.json
version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 0
  timeout: 2m
output:
  formats:
    text:
      path: stdout
    sarif:
      path: golangci-lint.sarif
linters:
  enable:
  - unconvert
  - gosec
  - errorlint
  - unparam
  - whitespace
  - wrapcheck
  - prealloc
  - nolintlint
